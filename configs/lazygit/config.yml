gui:
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#a9b1d6"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#292e42"
    cherryPickedCommitBgColor:
      - "#292e42"
      - bold
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    unstagedChangesColor:
      - "#f7768e"
    defaultFgColor:
      - "#c0caf5"
    searchingActiveBorderColor:
      - "#e0af68"
      - bold
    selectedRangeBgColor:
      - "#292e42"
    selectedRangeFgColor:
      - "#c0caf5"
    errorBorderColor:
      - "#f7768e"
      - bold
    errorFgColor:
      - "#f7768e"
    notARepo:
      - "#f7768e"
  border: single
  showIcons: false
  showCommandLog: false
  expandFocusedSidePanel: true
  skipRewordInEditorWarning: true
git:
  log:
    showGraph: always
  paging:
    colorArg: always
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium --all
os:
  edit: nvim
  editAtLine: nvim +{{line}} {{filename}}
  editAtLineAndWait: nvim +{{line}} {{filename}}
  openDirInEditor: nvim {{filename}}
