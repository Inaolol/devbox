add_newline = true
command_timeout = 200
format = "[╭─](bright-black)$username$directory$git_branch$git_status$line_break[╰─](bright-black)$character"

[username]
show_always = true
format = "[$user]($style) "
style_user = "dimmed yellow"
style_root = "bold red"

[character]
success_symbol = "[❯](bold yellow)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❮](bold yellow)"
vimcmd_replace_symbol = "[❮](bold yellow)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold white"
repo_root_style = "bold white"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
read_only = " "
read_only_style = "bold white"

[git_branch]
format = " [$branch]($style)"
style = "white"

[git_status]
format = '[$all_status]($style)'
style = "white"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = ""
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""
